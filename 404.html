<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Page not found — Aditya Soni</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0a0a; --fg:#f2f0ec; --dim:#aaa49a; --accent:#ff4a1f; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(760px, 100%); }
    .code { margin: 0 0 16px; color: var(--accent); font: 600 0.85rem ui-monospace, monospace; letter-spacing: 0.16em; }
    h1 { max-width: 10ch; margin: 0; font-size: clamp(3.5rem, 12vw, 8rem); line-height: 0.9; letter-spacing: -0.06em; }
    p { max-width: 50ch; margin: 28px 0; color: var(--dim); font-size: 1.1rem; line-height: 1.6; }
    a { display: inline-block; color: var(--fg); text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR / 404</p>
    <h1>Lost in the stack.</h1>
    <p>The page you requested does not exist or has moved. Return to the portfolio to continue.</p>
    <a href="/">Back to troublehacker.in →</a>
  </main>
</body>
</html>
