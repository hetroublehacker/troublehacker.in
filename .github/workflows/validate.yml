name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        # actions/checkout v6.0.2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate static site
        run: node scripts/validate-site.mjs
